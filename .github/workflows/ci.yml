name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    # Core tests need no GPU; golden-image and benchmark workflows run on a self-hosted Apple Silicon runner (DESIGN.md §18).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: scripts/license-headers.sh
      - run: scripts/core-purity.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
