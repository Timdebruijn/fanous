<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- SPDX-License-Identifier: GPL-3.0-only · Copyright (c) 2026 Tim de Bruijn · the mark itself is covered by TRADEMARKS.md -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1F24"/><stop offset="1" stop-color="#0B0C0E"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="540" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC532" stop-opacity="0.42"/><stop offset="0.55" stop-color="#FF8A3C" stop-opacity="0.12"/><stop offset="1" stop-color="#FF8A3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D27A"/><stop offset="1" stop-color="#B8862E"/>
    </linearGradient>
    <radialGradient id="flame" cx="512" cy="560" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6D6"/><stop offset="0.5" stop-color="#FFC532"/><stop offset="1" stop-color="#FF8A3C"/>
    </radialGradient>
    <clipPath id="body"><path d="M392 360 H632 L688 530 L632 700 H392 L336 530 Z"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <circle cx="512" cy="540" r="360" fill="url(#glow)"/>
  <!-- hanging ring and finial -->
  <circle cx="512" cy="196" r="26" fill="none" stroke="url(#brass)" stroke-width="12"/>
  <rect x="504" y="220" width="16" height="40" rx="6" fill="url(#brass)"/>
  <!-- dome -->
  <path d="M400 344 C410 290 460 258 512 258 C564 258 614 290 624 344 Z" fill="url(#brass)"/>
  <path d="M440 344 C450 306 480 286 512 286 C544 286 574 306 584 344" fill="none" stroke="#0B0C0E" stroke-opacity="0.35" stroke-width="8"/>
  <rect x="380" y="340" width="264" height="26" rx="8" fill="url(#brass)"/>
  <!-- coloured glass panels -->
  <g clip-path="url(#body)">
    <rect x="330" y="360" width="140" height="340" fill="#4C9EFF"/>
    <rect x="470" y="360" width="84" height="340" fill="url(#flame)"/>
    <rect x="554" y="360" width="140" height="340" fill="#FF5A5F"/>
    <path d="M336 530 L392 360 L470 360 L470 700 L392 700 Z" fill="#35D07F" fill-opacity="0.55"/>
    <path d="M688 530 L632 360 L554 360 L554 700 L632 700 Z" fill="#FFC532" fill-opacity="0.35"/>
    <!-- pointed-arch windows -->
    <path d="M512 410 C548 440 548 480 548 520 V650 H476 V520 C476 480 476 440 512 410 Z" fill="#FFF6D6" fill-opacity="0.85"/>
    <path d="M412 440 C432 456 438 480 438 506 V640 H394 L374 560 Z" fill="#0B0C0E" fill-opacity="0.28"/>
    <path d="M612 440 C592 456 586 480 586 506 V640 H630 L650 560 Z" fill="#0B0C0E" fill-opacity="0.28"/>
  </g>
  <!-- brass frame -->
  <path d="M392 360 H632 L688 530 L632 700 H392 L336 530 Z" fill="none" stroke="url(#brass)" stroke-width="14" stroke-linejoin="round"/>
  <path d="M470 362 V698 M554 362 V698 M342 530 H682" fill="none" stroke="url(#brass)" stroke-width="10"/>
  <!-- base and drop -->
  <path d="M404 700 H620 L588 748 H436 Z" fill="url(#brass)"/>
  <path d="M512 748 L536 790 L512 836 L488 790 Z" fill="url(#brass)"/>
</svg>
